<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.4 system-ui, -apple-system, sans-serif; margin: 0; padding: 14px; width: 270px;
         background: #1f2329; color: #e6e6e6; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  p { margin: 0 0 10px; }
  .host { font-family: ui-monospace, monospace; color: #fff; word-break: break-all; }
  .ok { color: #4cc38a; } .warn { color: #e0a43a; }
  button { width: 100%; padding: 7px; border: 0; border-radius: 6px; font: inherit; cursor: pointer;
           background: #e2901a; color: #111; font-weight: 600; }
  button.secondary { background: #3a3f47; color: #e6e6e6; font-weight: 400; margin-top: 6px; }
  [hidden] { display: none !important; }
  hr { border: 0; border-top: 1px solid #3a3f47; margin: 12px 0 8px; }
  button.link { background: none; color: #9aa4b1; font-weight: 400; padding: 2px; width: auto; }
  button.link:hover { color: #e6e6e6; }
  #bug h2 { font-size: 13px; margin: 0 0 6px; }
  #bug textarea { box-sizing: border-box; width: 100%; height: 84px; resize: vertical; margin: 4px 0 6px;
                  background: #15181c; color: #e6e6e6; border: 1px solid #3a3f47; border-radius: 6px;
                  padding: 6px; font: inherit; }
  #bug textarea:focus { outline: 1px solid #e2901a; }
  #bug img { display: block; width: 100%; border-radius: 4px; margin: 4px 0; border: 1px solid #3a3f47; }
  #bug details { margin: 4px 0 8px; color: #9aa4b1; }
  #bug pre { max-height: 140px; overflow: auto; font: 10px/1.35 ui-monospace, monospace; white-space: pre-wrap;
             background: #15181c; padding: 6px; border-radius: 4px; margin: 4px 0 0; color: #cfd5dc; }
  .small { font-size: 11px; color: #9aa4b1; }
</style>
</head>
<body>
  <h1>WPSD RadioID</h1>
  <p id="msg">Prüfe Seite …</p>
  <button id="enable" hidden>Für diese Adresse aktivieren</button>
  <button id="disable" class="secondary" hidden>Für diese Adresse deaktivieren</button>
  <div id="bugBar">
    <hr>
    <button id="bugStart" class="link">🐞 Fehler melden …</button>
  </div>

  <div id="bug" hidden>
    <hr>
    <h2>🐞 Fehler melden</h2>
    <p id="bugStatus" class="small">Erfasse Zustand …</p>
    <div id="bugForm" hidden>
      <img id="bugShot" alt="Screenshot der Seite" hidden>
      <details>
        <summary>Erfasste Daten anzeigen</summary>
        <pre id="bugPreview"></pre>
      </details>
      <div>Was ist schiefgelaufen?</div>
      <textarea id="bugText" placeholder="z.B. Namen erscheinen nicht in der Tabelle „Last Heard“ …"></textarea>
      <p class="small">Danach im Mailtext nur noch <b id="bugKey">⌘V</b> drücken – Bericht, Screenshot und Seiten-HTML werden eingefügt.</p>
      <button id="bugSend">E-Mail erstellen</button>
      <button id="bugCancel" class="secondary">Abbrechen</button>
    </div>
  </div>

  <script src="popup.js"></script>
  <script src="bugreport.js"></script>
</body>
</html>
